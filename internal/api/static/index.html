<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>riverroot</title>
  <!-- tailwind + vue from CDN — same setup as before, just using them for
       layout classes and data binding so we don't write raw DOM stuff -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body class="bg-stone-900 text-stone-300 font-mono min-h-screen">

<div id="app">
  <!-- top bar — logo, stats -->
  <div class="border-b border-stone-700 px-6 py-3 flex items-center justify-between bg-stone-800">
    <div class="flex items-center gap-6">
      <span class="text-amber-400 font-bold">riverroot</span>
      <div v-if="builds.length" class="flex items-center gap-4 text-sm text-stone-500">
        <span>{{ builds.length }} builds</span>
        <span class="text-emerald-400">{{ passCount }} passed</span>
        <span class="text-red-400">{{ failCount }} failed</span>
      </div>
    </div>
  </div>

  <div class="flex min-h-[calc(100vh-49px)]">

    <!-- left panel: build list -->
    <div class="w-80 border-r border-stone-700 overflow-y-auto bg-stone-850">
      <div v-if="builds.length === 0" class="p-4 text-stone-500 text-sm">
        no builds yet
      </div>
      <div v-for="(b, i) in builds" :key="b.ID || i"
        @click="selected = b"
        class="px-4 py-3 border-b border-stone-800 cursor-pointer hover:bg-stone-800 transition-colors border-l-2"
        :class="selected === b
          ? (b.Failed ? 'bg-stone-800 border-l-red-400' : 'bg-stone-800 border-l-emerald-400')
          : 'border-l-transparent'">
        <div class="flex items-center gap-2">
          <span class="text-xs" :class="b.Failed ? 'text-red-400' : 'text-emerald-400'">
            {{ b.Failed ? '✗' : '✓' }}
          </span>
          <span class="text-sm font-bold text-stone-200">{{ b.Pipeline }}</span>
          <span class="text-xs text-stone-500">#{{ builds.length - i }}</span>
        </div>
        <div class="mt-1 flex items-center gap-3 text-xs text-stone-500">
          <span v-if="b.CreatedAt">{{ formatTime(b.CreatedAt) }}</span>
          <span>{{ b.Steps.length }} steps</span>
          <!-- tiny dots for each step — green or red, quick visual -->
          <span class="flex gap-0.5">
            <span v-for="step in b.Steps"
              class="w-1.5 h-1.5 rounded-full"
              :class="step.ExitCode === 0 ? 'bg-emerald-500' : 'bg-red-500'"
              :title="step.Name"></span>
          </span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
Vue.createApp({
  data() {
    return { builds: [], selected: null }
  },
  computed: {
    // just counting pass/fail for the header stats
    passCount() { return this.builds.filter(b => !b.Failed).length },
    failCount() { return this.builds.filter(b => b.Failed).length }
  },
  mounted() {
    this.load()
  },
  methods: {
    load() {
      fetch('/builds').then(r => r.json()).then(data => {
        this.builds = data || []
        // auto-select the newest build so the right panel isn't blank on load
        if (this.builds.length && !this.selected) this.selected = this.builds[0]
      })
    },
    // turns sqlite timestamp into "5m ago" / "2h ago" / date
    // sqlite can return different formats so we try a few
    formatTime(ts) {
      let d = new Date(ts)
      if (isNaN(d)) d = new Date(ts.replace(' ', 'T') + 'Z')
      if (isNaN(d)) return ts
      const now = new Date()
      const diff = (now - d) / 1000
      if (diff < 60) return 'just now'
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago'
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago'
      return d.toLocaleDateString()
    }
  }
}).mount('#app')
</script>

</body>
</html>
